name: Elixir CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    name: ✨ Build + Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v7 # github.com/actions/checkout
    - name: 💧 Set Up Elixir
      uses: erlef/setup-beam@v1 # github.com/erlef/setup-beam
      with:
        elixir-version: '1.19.x' # Define the elixir version [required]
        otp-version: '28.1.x'    # Define the OTP version [required]
    - name: 📂 Restore Dependency Cache
      uses: actions/cache@v6   # github.com/actions/cache
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-

    - name: ⬇️ Install Dependencies
      run: mix deps.get

    - name: ✅ Run Tests
      run: mix ci --warnings-as-errors
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MIX_ENV: test
        AUTH_API_KEY: ${{ secrets.AUTH_API_KEY }}
    
    - name: 🎨 Check Code Format (mix format)
      run: mix format --check-formatted

    - name: 🔍 Lint The Code (credo)
      run: mix credo

    - name: 💯 Upload Coverage To Codecov
      uses: codecov/codecov-action@v7 # github.com/codecov/codecov-action


  # Continuous Deployment to Fly.io
  # https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
  deploy:
    name: 🚀 Deploy App
    runs-on: ubuntu-latest
    needs: [build]
    # stackoverflow.com/questions/58139406/run-job-specific-branch-github-action
    if: github.ref == 'refs/heads/main'
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7 # github.com/actions/checkout
      - uses: superfly/flyctl-actions@1.5
        with:
          args: "deploy"